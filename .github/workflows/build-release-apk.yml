
name: Build Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup signing
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > tomoko-release.jks
          {
            echo "storeFile=tomoko-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}"
          } > keystore.properties

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=https://api.tomoko.app" >> local.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tomoko-apk-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
